# Serves the viewer's static files inside its own container, reached only by
# the front door. Replaces the image's template, which also listens on IPv6
# and so fails to start on a host without it.
server {
  listen 80 default_server;
  root /usr/share/nginx/html;

  # The image ships every script pre-compressed, with an empty placeholder
  # beside it: serve the .gz, and decompress for a client that cannot take it.
  gzip_static always;
  gunzip on;

  # The front door keeps the access log; this one would only repeat it.
  access_log off;

  location / {
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
