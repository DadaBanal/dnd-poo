# Serves the viewer's static files inside its own container, reached only by
# the front door. Replaces the image's template, which also listens on IPv6
# and so fails to start on a host without it.
server {
  listen 80 default_server;
  root /usr/share/nginx/html;

  # The image ships every script pre-compressed, with an empty placeholder
  # beside it: serve the .gz, and decompress for a client that cannot take it.
  gzip_static always;
  gunzip on;

  # The front door keeps the access log; this one would only repeat it.
  access_log off;

  # How long a PC may keep each file (MEASURED, 24 Sep: without this, every
  # open of a study fetched the viewer's 5.2 MB of scripts again).
  #   - a file whose name carries its content hash never changes: a year;
  #   - the page, its configuration and the files named without a hash: keep,
  #     but ask the front door each time whether they changed (an ETag answers
  #     304 in a few milliseconds), so a new viewer image reaches every PC at
  #     its next open.
  # Images are not served here; the front door marks them no-store.
  location ~ "[0-9a-f]{16}\.(js|css|wasm|woff2)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location / {
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
