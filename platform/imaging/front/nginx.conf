# The front door, top level. The server itself is templates/front.conf.template,
# rendered at start with the site's hostname into conf.d/front.conf. Only that
# file is included: the image's conf.d/default.conf (its welcome page) is not.

user  nginx;
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /run/nginx.pid;

events {
  worker_connections  2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Paths only, never query strings: a DICOMweb query can carry a patient ID
  # or a name, and the access log must not.
  log_format front '$time_iso8601 $status $request_method $uri '
                   'bytes=$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                   '$server_protocol';
  access_log /dev/stdout front;

  server_tokens off;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout  65;

  include /etc/nginx/conf.d/front.conf;
}
