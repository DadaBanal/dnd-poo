# PMC imaging platform: Path A (WS23).
#
#   M1  the engine (Orthanc) and its index (PostgreSQL)
#   M2  the front door (nginx: TLS, HTTP/2), the viewer (OHIF), sign-in
#       (Keycloak checking PMC's Active Directory, oauth2-proxy holding each
#       person's session, orthanc-auth-service deciding what each role may
#       do), and the PMC front door app: the worklist at /pmc/
#   M3  backups: to the R740xd (compose.r740xd.yaml) and off-site
#
# Every image is pinned by digest. The engine and its index sit on a network
# with no route out. The front door is the only service on the edge network,
# and the only way in. Built and proven off-prem first; nothing here goes
# on-prem until the whole platform is built and Dada says so. Read README.md
# before changing anything.
#
#   tools/make-secrets.sh            generate the secrets (never committed)
#   docker compose up -d --wait      start the platform
#   ci/run.sh                        start it, test it, restart it, test again
#
# Site values are compose variables. None is a secret.
#   PMC_HOSTNAME   the front door's name (default imaging.pmcne.ph)
#   PMC_DICOM_AET  the engine's AE title (default PMC-IMAGING)
#   PMC_SECRETS    where the secrets are (default ./secrets)
#   PMC_LIBRARY    where official images are pulled from (default Docker Hub).
#                  The digest pins the content, so a mirror serves the
#                  identical image.
#   PMC_AD_*       PMC's Active Directory: its domain controllers, where the
#                  people and the five groups are, the read-only account, and
#                  the group behind each role. No default: Keycloak refuses
#                  to start without them. See README.md, Sign-in.

name: pmc-imaging

x-logging: &logging
  # The local driver rotates and compresses by default; json-file would
  # grow until the disk fills.
  driver: local

services:
  pg-index:
    # PostgreSQL 18.6 (the official image, by digest) with pgBackRest 2.59.1,
    # built from backup/postgres. Every write-ahead log segment is archived
    # to the pgbackrest-repo volume as it completes (backup/pg-start.sh).
    image: pmc-imaging/postgres:local
    pull_policy: never
    build:
      context: ./backup/postgres
      args: { PMC_LIBRARY: "${PMC_LIBRARY:-docker.io/library}" }
    entrypoint: [/pmc/backup/pg-start.sh]
    command: [postgres, -c, wal_level=replica, -c, archive_mode=on, -c, "archive_command=pgbackrest --stanza=index archive-push %p", -c, archive_timeout=60]
    environment:
      PMC_BACKUP_STANZA: index
      POSTGRES_DB: orthanc
      POSTGRES_USER: orthanc
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-index-password
      # Built-in C.UTF-8 collation: sort order that no glibc update can
      # change under an existing index. PostgreSQL 18 turns data checksums
      # on by default; ci/run.sh checks both.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
      TZ: Asia/Manila
    secrets: [pg-index-password]
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker;
      # the volume is mounted one level up, as the image documents.
      - pg-index-data:/var/lib/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./backup:/pmc/backup:ro
      - ./backup/initdb-stanza.sh:/docker-entrypoint-initdb.d/90-backup-stanza.sh:ro
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orthanc -d orthanc]
      interval: 5s
      timeout: 5s
      retries: 24
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging
    networks: [engine]

  orthanc:
    image: orthancteam/orthanc:26.9.1@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    depends_on:
      pg-index: { condition: service_healthy }
    environment:
      TZ: Asia/Manila
      ORTHANC__DICOM_AET: ${PMC_DICOM_AET:-PMC-IMAGING}
      # Explorer 2 is on by default in this image. ICT's admin surface is
      # decided with sign-in (M2.2); until then it stays off.
      ORTHANC_EXPLORER_2_ENABLED: "false"
    secrets:
      - source: pg-index-password
        target: ORTHANC__POSTGRESQL__PASSWORD
      - source: auth-service-password
        target: ORTHANC__AUTHORIZATION__WEB_SERVICE_PASSWORD
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-storage:/var/lib/orthanc/db
    healthcheck:
      # Alive means the REST API answers, even if only to refuse an anonymous
      # caller: the engine's health must not depend on sign-in being up.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8042/system", timeout=5)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code in (401, 403) else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging
    networks: [engine]

  viewer:
    # The stock OHIF image, reached only through the front door. PMC's
    # configuration is viewer/app-config.js and its server block is
    # viewer/nginx.conf. The image serves pre-compressed files, so the config
    # is compressed into place at start; the image's own entrypoint is not used.
    image: ohif/app:v3.13.10@sha256:559a820cf7c423e2b15aa6db9ba15aaee966e519c6f899432c1abace92b3b07a
    entrypoint:
      - /bin/sh
      - -c
      - >-
        gzip -9 -c /pmc/app-config.js > /usr/share/nginx/html/app-config.js.gz &&
        : > /usr/share/nginx/html/app-config.js &&
        exec nginx -g 'daemon off;'
    volumes:
      - ./viewer/app-config.js:/pmc/app-config.js:ro
      - ./viewer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    networks: [engine]

  migrate:
    # PMC's platform database schema, as code (db/migrations), applied by
    # dbmate as the role that owns it. It runs once and exits; the app starts
    # only after it has succeeded.
    image: ghcr.io/amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb
    depends_on:
      pg-platform: { condition: service_healthy }
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        DATABASE_URL="postgres://platform_owner:$$(cat /run/secrets/platform-owner-password)@pg-platform:5432/platform?sslmode=disable"
        exec dbmate --migrations-dir /db/migrations --no-dump-schema --wait up --strict
    secrets:
      - platform-owner-password
    volumes:
      - ./db:/db:ro
    restart: "no"
    logging: *logging
    networks: [engine]

  app:
    # The PMC front door app (M2.3): the worklist every person lands on, at
    # /pmc/. It asks the engine with each person's own token, so the engine
    # decides what each person sees; the platform's key reads only the
    # engine's change log, to tell open pages that something arrived.
    # Built from ./app (ci/run.sh builds it; M4 ships it as an image).
    image: pmc-imaging/app:local
    pull_policy: never
    build: ./app
    depends_on:
      orthanc: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      TZ: Asia/Manila
      PMC_HOSTNAME: ${PMC_HOSTNAME:-imaging.pmcne.ph}
      ENGINE_URL: http://orthanc:8042
      KEYCLOAK_REALM_URL: http://keycloak:8080/auth/realms/pmc
      API_KEY_SECRET: /run/secrets/svc-platform-api-key
      PLATFORM_DB_HOST: pg-platform
      PLATFORM_DB_PASSWORD_SECRET: /run/secrets/platform-app-password
    secrets:
      - svc-platform-api-key
      - platform-app-password
    # It writes nothing and needs no privilege.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/pmc/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    networks: [engine]

  front:
    image: ${PMC_LIBRARY:-docker.io/library}/nginx:1.30.5@sha256:0aa2d81d65bc0cac0407e738b8f07d312c8685a84225fcb4db7bcbdd8c9bdf11
    depends_on:
      orthanc: { condition: service_healthy }
      viewer: { condition: service_healthy }
      app: { condition: service_healthy }
      oauth2-proxy: { condition: service_started }
      keycloak: { condition: service_healthy }
    environment:
      TZ: Asia/Manila
      PMC_HOSTNAME: ${PMC_HOSTNAME:-imaging.pmcne.ph}
      # The Keycloak realms whose sign-in pages people may reach.
      PMC_PUBLIC_REALMS: pmc
    secrets:
      - source: tls-certificate
        target: tls.crt
      - source: tls-key
        target: tls.key
    volumes:
      - ./front/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./front/templates:/etc/nginx/templates:ro
    healthcheck:
      # The TLS server answers for the site's name. (If the template failed to
      # render, nginx would start with no server at all; this catches it.)
      test: [CMD-SHELL, 'curl -fsk -o /dev/null --resolve "$$PMC_HOSTNAME:443:127.0.0.1" "https://$$PMC_HOSTNAME/"']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    networks: [engine, edge]

  # ---- backups (M3) -------------------------------------------------------------
  files-backup:
    # The nightly snapshot to the R740xd's Kopia server (tools/backup.sh),
    # after the databases' own backup: the engine's files and the pgBackRest
    # repository, read-only. The server accepts new snapshots from this host
    # and refuses to delete any.
    image: kopia/kopia:0.23.1@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
    profiles: [backup]
    entrypoint: [/bin/sh, /pmc/kopia/snapshot.sh]
    environment:
      # Site values: where the R740xd's Kopia server answers, and the SHA-256
      # fingerprint of its certificate (M4 sets both at install).
      PMC_KOPIA_SERVER_URL: ${PMC_KOPIA_SERVER_URL:-}
      PMC_KOPIA_SERVER_FINGERPRINT: ${PMC_KOPIA_SERVER_FINGERPRINT:-}
    secrets: [kopia-client-password]
    volumes:
      - orthanc-storage:/sources/engine-files:ro
      - pgbackrest-repo:/sources/database-backups:ro
      - ./backup/kopia:/pmc/kopia:ro
    restart: "no"
    logging: *logging
    networks: [backup]

  files-restore:
    # Disaster recovery: the engine's files and the database backups from the
    # off-site copy, read-only there, into empty volumes (see the README's
    # Backups). Needs the escrowed repository password and storage key.
    image: kopia/kopia:0.23.1@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
    profiles: [restore]
    entrypoint: [/bin/sh, /pmc/kopia/restore.sh]
    environment:
      PMC_BACKUP_AZURE_ACCOUNT: ${PMC_BACKUP_AZURE_ACCOUNT:-}
      PMC_BACKUP_AZURE_KOPIA_CONTAINER: ${PMC_BACKUP_AZURE_KOPIA_CONTAINER:-kopia}
    secrets: [kopia-repo-password, backup-azure-key]
    volumes:
      - orthanc-storage:/restore/engine-files
      - pgbackrest-repo:/restore/database-backups
      - ./backup/kopia:/pmc/kopia:ro
    restart: "no"
    logging: *logging
    networks: [backup]

  # ---- sign-in (M2.2) ---------------------------------------------------------

  pg-platform:
    # The platform's own database cluster, apart from the engine's index:
    # Keycloak's database, and PMC's platform database (db/migrations).
    # PostgreSQL 18.6 (the official image, by digest) with pgBackRest 2.59.1,
    # built from backup/postgres. Every write-ahead log segment is archived
    # to the pgbackrest-repo volume as it completes (backup/pg-start.sh).
    image: pmc-imaging/postgres:local
    pull_policy: never
    build:
      context: ./backup/postgres
      args: { PMC_LIBRARY: "${PMC_LIBRARY:-docker.io/library}" }
    entrypoint: [/pmc/backup/pg-start.sh]
    command: [postgres, -c, wal_level=replica, -c, archive_mode=on, -c, "archive_command=pgbackrest --stanza=platform archive-push %p", -c, archive_timeout=60]
    environment:
      PMC_BACKUP_STANZA: platform
      POSTGRES_DB: pmc
      POSTGRES_USER: pmc
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-platform-password
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
      TZ: Asia/Manila
    secrets: [pg-platform-password, keycloak-db-password, platform-owner-password, platform-app-password]
    volumes:
      - pg-platform-data:/var/lib/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./backup:/pmc/backup:ro
      - ./identity/pg-platform-init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
      - ./backup/initdb-stanza.sh:/docker-entrypoint-initdb.d/90-backup-stanza.sh:ro
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pmc -d pmc]
      interval: 5s
      timeout: 5s
      retries: 24
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging
    networks: [engine]

  keycloak:
    # Signs people in against PMC's Active Directory (LDAPS, read-only) and
    # turns five AD groups into PMC roles. It keeps no passwords: AD checks
    # each one, and the pmc realm has no local accounts for people. Its admin
    # console is not routed by the front door.
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    depends_on:
      pg-platform: { condition: service_healthy }
    entrypoint: [/pmc/keycloak-start.sh]
    environment:
      TZ: Asia/Manila
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg-platform:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_CACHE: local
      # Behind the front door: plain HTTP inside, the public name outside, and
      # the platform's services may call it by its container name.
      KC_HOSTNAME: https://${PMC_HOSTNAME:-imaging.pmcne.ph}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      PMC_HOSTNAME: ${PMC_HOSTNAME:-imaging.pmcne.ph}
      # How long a person's access token lives. oauth2-proxy renews it before
      # then (OAUTH2_PROXY_COOKIE_REFRESH), and the engine refuses it after.
      PMC_ACCESS_TOKEN_SECONDS: "300"
      # PMC's Active Directory (site values; README.md, Sign-in): its domain
      # controllers as LDAPS URLs, space-separated (ldaps://<dc>:636 ...);
      # where the people are; where the five imaging groups are; the
      # read-only account's DN; and the name (cn) of the group behind each
      # role.
      PMC_AD_URL: ${PMC_AD_URL:-}
      PMC_AD_USERS_DN: ${PMC_AD_USERS_DN:-}
      PMC_AD_GROUPS_DN: ${PMC_AD_GROUPS_DN:-}
      PMC_AD_BIND_DN: ${PMC_AD_BIND_DN:-}
      PMC_AD_GROUP_RADIOLOGISTS: ${PMC_AD_GROUP_RADIOLOGISTS:-}
      PMC_AD_GROUP_CARDIOLOGISTS: ${PMC_AD_GROUP_CARDIOLOGISTS:-}
      PMC_AD_GROUP_TECHNOLOGISTS: ${PMC_AD_GROUP_TECHNOLOGISTS:-}
      PMC_AD_GROUP_REFERRERS: ${PMC_AD_GROUP_REFERRERS:-}
      PMC_AD_GROUP_ICT_ADMINS: ${PMC_AD_GROUP_ICT_ADMINS:-}
    secrets:
      - keycloak-db-password
      - front-door-client-secret
      - admin-cli-client-secret
      - svc-platform-api-key
      - ad-bind-password
      - source: ad-ca
        target: ad-ca.pem
    volumes:
      - ./identity/keycloak-start.sh:/pmc/keycloak-start.sh:ro
      - ./identity/realm-pmc.json:/opt/keycloak/data/import/realm-pmc.json:ro
    healthcheck:
      # Ready means the pmc realm answers. Keycloak's own readiness endpoint
      # says UP while it is still importing realms and answering 503
      # (MEASURED, 26.7.4), which the services behind it cannot use.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /auth/realms/pmc HTTP/1.1\r\nHost: keycloak\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    restart: unless-stopped
    logging: *logging
    # engine: its own database and the services that call it. directory:
    # PMC's domain controllers, and nothing else.
    networks: [engine, directory]

  auth-service:
    # Decides, for the engine, who a caller is and what that caller's roles
    # permit (identity/auth-service/permissions.json).
    image: orthancteam/orthanc-auth-service:26.8.1@sha256:b29489f9cdedc94c67d2d5f75389e6fb175e4578d47b1e4704b0f308dadd4eb5
    depends_on:
      keycloak: { condition: service_healthy }
    entrypoint: [/pmc/start.sh]
    environment:
      TZ: Asia/Manila
      ENABLE_KEYCLOAK: "true"
      KEYCLOAK_URI: http://keycloak:8080/auth/realms/pmc/
      KEYCLOAK_ADMIN_URI: http://keycloak:8080/auth/admin/realms/pmc/
      ENABLE_KEYCLOAK_API_KEYS: "true"
      PERMISSIONS_FILE_PATH: /pmc/permissions.json
    secrets:
      - auth-service-password
      - auth-service-secret-key
      - admin-cli-client-secret
    volumes:
      - ./identity/auth-service:/pmc:ro
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    logging: *logging
    networks: [engine]

  oauth2-proxy:
    # Holds each person's session in an encrypted HttpOnly cookie, so no token
    # ever reaches the browser. The front door asks it about every request.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    depends_on:
      keycloak: { condition: service_healthy }
      sessions: { condition: service_healthy }
    command:
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --provider=keycloak-oidc
      - --client-id=pmc-front-door
      - --client-secret-file=/run/secrets/front-door-client-secret
      - --cookie-secret-file=/run/secrets/front-door-cookie-secret
      - --cookie-name=__Host-pmc-session
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=12h
      - --redirect-url=https://${PMC_HOSTNAME:-imaging.pmcne.ph}/oauth2/callback
      - --whitelist-domain=${PMC_HOSTNAME:-imaging.pmcne.ph}
      # The browser goes to the public name, where Keycloak asks for the
      # person's Windows logon; the proxy itself talks to Keycloak inside.
      - --oidc-issuer-url=https://${PMC_HOSTNAME:-imaging.pmcne.ph}/auth/realms/pmc
      - --skip-oidc-discovery=true
      - --login-url=https://${PMC_HOSTNAME:-imaging.pmcne.ph}/auth/realms/pmc/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/auth/realms/pmc/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/auth/realms/pmc/protocol/openid-connect/certs
      - --profile-url=http://keycloak:8080/auth/realms/pmc/protocol/openid-connect/userinfo
      - --validate-url=http://keycloak:8080/auth/realms/pmc/protocol/openid-connect/userinfo
      - --backend-logout-url=http://keycloak:8080/auth/realms/pmc/protocol/openid-connect/logout?id_token_hint={id_token}
      - --code-challenge-method=S256
      - --email-domain=*
      # Only people who hold a PMC role get a session at all.
      - --allowed-role=pmc-radiologist
      - --allowed-role=pmc-cardiologist
      - --allowed-role=pmc-technologist
      - --allowed-role=pmc-referrer
      - --allowed-role=pmc-ict-admin
      - --set-xauthrequest=true
      - --pass-access-token=true
      - --skip-provider-button=true
      - --upstream=static://202
      - --silence-ping-logging=true
      # Sessions live server-side, encrypted by oauth2-proxy; the cookie is
      # only a ticket. (A cookie holding the tokens outgrows one cookie, and
      # the front door cannot pass a split one back when it is refreshed.)
      - --session-store-type=redis
      - --redis-connection-url=redis://sessions:6379/0
    environment:
      # Renew a person's access token once it is this old: always shorter than
      # the token's own life (PMC_ACCESS_TOKEN_SECONDS, on keycloak).
      OAUTH2_PROXY_COOKIE_REFRESH: 4m
    secrets:
      - front-door-client-secret
      - front-door-cookie-secret
    restart: unless-stopped
    logging: *logging
    networks: [engine, sessions]

  sessions:
    # oauth2-proxy's session store. In memory only: a restart signs everyone
    # out, which is the safe way to fail.
    image: valkey/valkey:9.2-trixie@sha256:247b5e730bdc9dc29fddb8274d1731b203a1a1a46af63eae3a9d55b4bf74853f
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 256mb, --maxmemory-policy, volatile-ttl]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
    networks: [sessions]

networks:
  engine:
    # No route out. Nothing on it can call the internet, and nothing on it is
    # published to the host.
    internal: true
  edge:
    # Where people arrive. Only the front door is on it.
    {}
  directory:
    # Keycloak to PMC's domain controllers (LDAPS, 636), for the sign-in.
    # Nothing on the platform needs the internet; on site the host's firewall
    # lets this network reach the domain controllers and nothing else (M4).
    {}
  sessions:
    # oauth2-proxy and its session store, and nothing else.
    internal: true
  backup:
    # From the primary's backup jobs to the R740xd, and from there to Azure.
    # The databases and the engine are not on it.
    {}

volumes:
  pg-index-data: {}
  orthanc-storage: {}
  pg-platform-data: {}
  # Both clusters' pgBackRest repository: backups and archived write-ahead
  # log. Snapshotted nightly to the R740xd (files-backup).
  pgbackrest-repo: {}

secrets:
  kopia-client-password:
    file: ${PMC_SECRETS:-./secrets}/kopia-client-password
  kopia-repo-password:
    # Encrypts the Kopia repository. Escrowed off both hosts: without it no
    # backup can be read.
    file: ${PMC_SECRETS:-./secrets}/kopia-repo-password
  backup-azure-key:
