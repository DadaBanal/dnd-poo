# PMC's sign-in page: Keycloak 26's own v2 page in PMC's 2026 identity
# (README.md, Branding). Only the styles, one script, the footer and a few
# words change. The form, its fields and what it does are Keycloak's, so an
# upgrade keeps working and the tests' #username, #password and #kc-login stay.
parent=keycloak.v2
import=common/keycloak

# keycloak.v2's own stylesheet first, then PMC's on top of it.
styles=css/styles.css css/pmc.css
# Says when Caps Lock is on, as Voyager's sign-in does.
scripts=js/pmc.js

# The PMC mark in the browser tab: a copy of brand/pmc-mark.png, which
# ci/run.sh checks is unchanged.
favIcon=img/pmc-mark.png
favIconType=image/png

# Follows the PC's light or dark setting, as the app does.
darkMode=true
