# Test overlay for ci/run.sh. Never used on-prem.
#
# Shortens the clocks the tests wait on, seals the edge and egress networks,
# stands a test realm in for Microsoft Entra ID, and adds two runners:
#   tests    Python, on the engine network: plays the modalities over DICOM
#            and reads back over REST and DICOMweb (M1). It is on the edge
#            network too, so it can also sign in at the front door as a
#            person would, and look at what the engine is handed (M2.2).
#   browser  Playwright + Chromium, on the edge network only: a person at a
#            PC, who can reach the front door and nothing else (M2).
# Both images are built by ci/run.sh (it may need a build proxy that compose
# cannot pass conditionally).

services:
  orthanc:
    environment:
      ORTHANC__STABLE_AGE: "5"
      ORTHANC__WORKLISTS__HOUSEKEEPING_INTERVAL: "5"

  front:
    environment:
      PMC_PUBLIC_REALMS: pmc|entra-sim
    networks:
      engine: {}
      edge:
        aliases: ["${PMC_HOSTNAME:-imaging.pmcne.test}"]

  keycloak:
    # A second realm in the same Keycloak plays Entra ID: it signs in the
    # invented users and issues a "groups" claim of object IDs, as Entra
    # does. The IDs below are invented too.
    environment:
      # A person's token lives 60 s here, not 5 min, so a test can outlive it.
      PMC_ACCESS_TOKEN_SECONDS: "60"
      PMC_ENTRA_CLIENT_ID: pmc-keycloak-broker
      PMC_ENTRA_AUTHORIZATION_URL: https://${PMC_HOSTNAME:-imaging.pmcne.test}/auth/realms/entra-sim/protocol/openid-connect/auth
      PMC_ENTRA_TOKEN_URL: http://keycloak:8080/auth/realms/entra-sim/protocol/openid-connect/token
      PMC_ENTRA_JWKS_URL: http://keycloak:8080/auth/realms/entra-sim/protocol/openid-connect/certs
      PMC_ENTRA_USERINFO_URL: http://keycloak:8080/auth/realms/entra-sim/protocol/openid-connect/userinfo
      PMC_ENTRA_ISSUER: https://${PMC_HOSTNAME:-imaging.pmcne.test}/auth/realms/entra-sim
      PMC_ENTRA_GROUP_RADIOLOGISTS: 0e5b1c2a-0000-4000-8000-000000000001
      PMC_ENTRA_GROUP_CARDIOLOGISTS: 0e5b1c2a-0000-4000-8000-000000000002
      PMC_ENTRA_GROUP_TECHNOLOGISTS: 0e5b1c2a-0000-4000-8000-000000000003
      PMC_ENTRA_GROUP_REFERRERS: 0e5b1c2a-0000-4000-8000-000000000004
      PMC_ENTRA_GROUP_ICT_ADMINS: 0e5b1c2a-0000-4000-8000-000000000005
    secrets:
      - keycloak-db-password
      - front-door-client-secret
      - admin-cli-client-secret
      - svc-platform-api-key
      - entra-client-secret
      - test-user-password
    volumes:
      - ./identity/test/realm-entra-sim.json:/opt/keycloak/data/import/realm-entra-sim.json:ro

  oauth2-proxy:
    environment:
      # Renewed at 40 s, before the 60 s token above runs out.
      OAUTH2_PROXY_COOKIE_REFRESH: 40s

  # ---- backups (M3): the R740xd beside the primary, and Azure's stand-in -------
  kopia-server:
    environment:
      PMC_BACKUP_AZURE_ACCOUNT: pmcoffsite
      # Kopia reaches Azure at https://<account>.<domain>; here, the stand-in.
      PMC_BACKUP_AZURE_KOPIA_DOMAIN: azurite:10000
      SSL_CERT_FILE: /run/secrets/test-ca
    secrets: [test-ca]

  files-backup:
    environment:
      PMC_KOPIA_SERVER_URL: https://kopia-server:51515
      PMC_KOPIA_SERVER_FINGERPRINT: ${PMC_KOPIA_SERVER_FINGERPRINT:-}

  files-restore:
    environment:
      PMC_BACKUP_AZURE_ACCOUNT: pmcoffsite
      PMC_BACKUP_AZURE_KOPIA_DOMAIN: azurite:10000
      SSL_CERT_FILE: /run/secrets/test-ca
    secrets: [test-ca]

  azurite:
    # Stands in for the Azure storage account: Azurite 3.37.0, over TLS with
    # the test certificate. Its data is the off-site copy, the one volume the
    # disaster drill keeps. ci/run.sh makes the container in it, as ICT will
    # make the real one (ci/azure-standin-container.mjs).
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        export AZURITE_ACCOUNTS="pmcoffsite:$$(cat /run/secrets/backup-azure-key)";
        exec azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
        --cert /run/secrets/azurite-cert --key /run/secrets/azurite-key --skipApiVersionCheck
    environment:
      PMC_BACKUP_AZURE_ACCOUNT: pmcoffsite
    secrets: [backup-azure-key, azurite-cert, azurite-key, test-ca]
    volumes:
      - azure-standin:/data
      - ./ci/azure-standin-container.mjs:/pmc/azure-standin-container.mjs:ro
    healthcheck:
      # Ready once the blob service accepts a connection.
      test: [CMD, node, -e, "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      backup:
        # Kopia addresses the account as a host name, as real Azure does.
        aliases: [pmcoffsite.azurite]

  tests:
    image: pmc-imaging/tests:local
    pull_policy: never
    profiles: [test]
    depends_on:
      orthanc: { condition: service_healthy }
    environment:
      ENGINE_HOST: orthanc
      ENGINE_AET: ${PMC_DICOM_AET:-PMC-IMAGING}
      RESULTS_DIR: /results
      API_KEY_SECRET: /run/secrets/svc-platform-api-key
      RUN_PHASE: ${RUN_PHASE:-first}
      PMC_HOSTNAME: ${PMC_HOSTNAME:-imaging.pmcne.test}
      TEST_USER_PASSWORD_SECRET: /run/secrets/test-user-password
      TEST_CA_SECRET: /run/secrets/test-ca
    secrets:
      - svc-platform-api-key
      - test-user-password
      - test-ca
    volumes:
      - ./.results:/results
    networks: [engine, edge]

  browser:
    image: pmc-imaging/browser:local
    pull_policy: never
    profiles: [test]
    depends_on:
      front: { condition: service_started }
    environment:
      PMC_HOSTNAME: ${PMC_HOSTNAME:-imaging.pmcne.test}
      RESULTS_DIR: /results
      RUN_PHASE: ${RUN_PHASE:-first}
      # ci/run.sh runs this as the invoking user, who has no home in the image.
      HOME: /tmp
      TEST_USER_PASSWORD_SECRET: /run/secrets/test-user-password
    secrets:
      - test-user-password
    volumes:
      - ./.results:/results
    # Chromium wants more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    networks: [edge]

networks:
  # In the test nothing can reach the internet, so a request that tries to
  # leave shows up as a failure.
  edge:
    internal: true
  egress:
    internal: true
  backup:
    internal: true

volumes:
  azure-standin: {}

secrets:
  test-user-password:
    file: ${PMC_SECRETS:-./secrets}/test-user-password
  # The throwaway CA behind the test certificate (tools/make-test-tls.sh), so
  # the Python runner checks the front door's certificate instead of ignoring it.
  test-ca:
    file: ${PMC_SECRETS:-./secrets}/tls/ca.crt
  azurite-cert:
    file: ${PMC_SECRETS:-./secrets}/tls/azurite.crt
  azurite-key:
    file: ${PMC_SECRETS:-./secrets}/tls/azurite.key
