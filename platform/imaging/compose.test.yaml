# Test overlay for ci/run.sh. Never used on-prem.
#
# Shortens the clocks the tests wait on, seals the edge, directory, backup and
# alerts networks, stands Samba in for PMC's Active Directory, Azurite for
# Azure and Mailpit for PMC's mail relay, and adds two runners:
#   tests    Python, on the engine network: plays the modalities over DICOM
#            and reads back over REST and DICOMweb (M1). It is on the edge
#            network too, so it can also sign in at the front door as a
#            person would, and look at what the engine is handed (M2.2).
#   browser  Playwright + Chromium, on the edge network only: a person at a
#            PC, who can reach the front door and nothing else (M2).
# Both images are built by ci/run.sh (it may need a build proxy that compose
# cannot pass conditionally).

services:
  orthanc:
    environment:
      ORTHANC__STABLE_AGE: "5"
      ORTHANC__WORKLISTS__HOUSEKEEPING_INTERVAL: "5"

  front:
    networks:
      engine: {}
      edge:
        aliases: ["${PMC_HOSTNAME:-imaging.pmcne.test}"]

  keycloak:
    # Signs people in against the stand-in Active Directory below: the same
    # realm, the same LDAPS, only the domain is invented.
    depends_on:
      ad-dc: { condition: service_healthy }
    environment:
      # A person's token lives 60 s here, not 5 min, so a test can outlive it.
      PMC_ACCESS_TOKEN_SECONDS: "60"
      PMC_AD_URL: ldaps://dc1.pmc.test:636
      PMC_AD_USERS_DN: CN=Users,DC=pmc,DC=test
      PMC_AD_GROUPS_DN: OU=PMC Imaging,DC=pmc,DC=test
      PMC_AD_BIND_DN: CN=svc-pmc-imaging,CN=Users,DC=pmc,DC=test
      PMC_AD_GROUP_RADIOLOGISTS: PMC Imaging Radiologists
      PMC_AD_GROUP_CARDIOLOGISTS: PMC Imaging Cardiologists
      PMC_AD_GROUP_TECHNOLOGISTS: PMC Imaging Technologists
      PMC_AD_GROUP_REFERRERS: PMC Imaging Referrers
      PMC_AD_GROUP_ICT_ADMINS: PMC Imaging ICT Admins

  ad-dc:
    # Stands in for PMC's Active Directory: Samba's AD domain controller
    # (identity/test/ad/), with invented people and groups, answering LDAPS
    # as dc1.pmc.test with a certificate from the test CA. Its data is kept,
    # as a real domain's would be, through the restart and the disaster
    # drill: the imaging platform's disaster is not the directory's.
    image: pmc-imaging/ad-standin:local
    pull_policy: never
    hostname: dc1
    secrets:
      - ad-admin-password
      - ad-bind-password
      - test-user-password
      - test-ca
      - source: ad-tls-cert
        target: ad-tls-cert
      - source: ad-tls-key
        target: ad-tls-key
    volumes:
      - ad-standin:/var/lib/samba
    healthcheck:
      # Ready once LDAPS accepts a connection (after the first start's
      # provisioning).
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/636"]
      interval: 2s
      timeout: 5s
      retries: 90
    networks:
      directory:
        aliases: [dc1.pmc.test]

  oauth2-proxy:
    environment:
      # Renewed at 40 s, before the 60 s token above runs out.
      OAUTH2_PROXY_COOKIE_REFRESH: 40s

  # ---- feed watch and alerts (M3): faster clocks, and a mail relay to read ----
  watch:
    environment:
      PMC_AD_URL: ldaps://dc1.pmc.test:636
      # One test modality may stay silent 20 s, not a day.
      PMC_FEED_SILENCE_OVERRIDES: watch-quiet=20s
      POLL_SECONDS: "2"
      CHECK_SECONDS: "5"

  alertmanager:
    environment:
      PMC_ALERT_EMAIL_TO: ict@pmc.test
      PMC_ALERT_EMAIL_FROM: imaging-alerts@pmc.test
      PMC_ALERT_SMTP: mailpit:1025
      PMC_ALERT_SMTP_TLS: "false"

  mailpit:
    # Stands in for PMC's mail relay: it keeps every message it is sent, and
    # the tests read them through its API.
    image: ghcr.io/axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    networks: [alerts]

  # ---- backups (M3): the R740xd beside the primary, and Azure's stand-in -------
  kopia-server:
    environment:
      PMC_BACKUP_AZURE_ACCOUNT: pmcoffsite
      # Kopia reaches Azure at https://<account>.<domain>; here, the stand-in.
      PMC_BACKUP_AZURE_KOPIA_DOMAIN: azurite:10000
      SSL_CERT_FILE: /run/secrets/test-ca
    secrets: [test-ca]

  files-backup:
    environment:
      PMC_KOPIA_SERVER_URL: https://kopia-server:51515
      PMC_KOPIA_SERVER_FINGERPRINT: ${PMC_KOPIA_SERVER_FINGERPRINT:-}

  files-restore:
    environment:
      PMC_BACKUP_AZURE_ACCOUNT: pmcoffsite
      PMC_BACKUP_AZURE_KOPIA_DOMAIN: azurite:10000
      SSL_CERT_FILE: /run/secrets/test-ca
    secrets: [test-ca]

  azurite:
    # Stands in for the Azure storage account: Azurite 3.37.0, over TLS with
    # the test certificate. Its data is the off-site copy, the one volume the
    # disaster drill keeps. ci/run.sh makes the container in it, as ICT will
    # make the real one (ci/azure-standin-container.mjs).
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        export AZURITE_ACCOUNTS="pmcoffsite:$$(cat /run/secrets/backup-azure-key)";
        exec azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
        --cert /run/secrets/azurite-cert --key /run/secrets/azurite-key --skipApiVersionCheck
    environment:
      PMC_BACKUP_AZURE_ACCOUNT: pmcoffsite
    secrets: [backup-azure-key, azurite-cert, azurite-key, test-ca]
    volumes:
      - azure-standin:/data
      - ./ci/azure-standin-container.mjs:/pmc/azure-standin-container.mjs:ro
    healthcheck:
      # Ready once the blob service accepts a connection.
      test: [CMD, node, -e, "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      backup:
        # Kopia addresses the account as a host name, as real Azure does.
        aliases: [pmcoffsite.azurite]

  tests:
    image: pmc-imaging/tests:local
    pull_policy: never
    profiles: [test]
    depends_on:
      orthanc: { condition: service_healthy }
    environment:
      ENGINE_HOST: orthanc
      ENGINE_AET: ${PMC_DICOM_AET:-PMC-IMAGING}
      RESULTS_DIR: /results
      API_KEY_SECRET: /run/secrets/svc-platform-api-key
      RUN_PHASE: ${RUN_PHASE:-first}
      PMC_HOSTNAME: ${PMC_HOSTNAME:-imaging.pmcne.test}
      TEST_USER_PASSWORD_SECRET: /run/secrets/test-user-password
      TEST_CA_SECRET: /run/secrets/test-ca
      # The stand-in AD, changed the way ICT's tools would change it.
      AD_URL: ldaps://dc1.pmc.test:636
      AD_BASE: DC=pmc,DC=test
      AD_ADMIN_PASSWORD_SECRET: /run/secrets/ad-admin-password
      # The feed watch, and the stand-in mail relay's inbox.
      WATCH_URL: http://watch:9100
      MAILPIT_URL: http://mailpit:8025
    secrets:
      - svc-platform-api-key
      - test-user-password
      - test-ca
      - ad-admin-password
    volumes:
      - ./.results:/results
    networks: [engine, edge, directory, monitor, alerts]

  browser:
    image: pmc-imaging/browser:local
    pull_policy: never
    profiles: [test]
    depends_on:
      front: { condition: service_started }
    environment:
      PMC_HOSTNAME: ${PMC_HOSTNAME:-imaging.pmcne.test}
      RESULTS_DIR: /results
      RUN_PHASE: ${RUN_PHASE:-first}
      # ci/run.sh runs this as the invoking user, who has no home in the image.
      HOME: /tmp
      TEST_USER_PASSWORD_SECRET: /run/secrets/test-user-password
    secrets:
      - test-user-password
    volumes:
      - ./.results:/results
    # Chromium wants more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    networks: [edge]

networks:
  # In the test nothing can reach the internet, so a request that tries to
  # leave shows up as a failure.
  edge:
    internal: true
  directory:
    internal: true
  backup:
    internal: true
  alerts:
    internal: true

volumes:
  azure-standin: {}
  ad-standin: {}

secrets:
  test-user-password:
    file: ${PMC_SECRETS:-./secrets}/test-user-password
  # The throwaway CA behind the test certificate (tools/make-test-tls.sh), so
  # the Python runner checks the front door's certificate instead of ignoring it.
  test-ca:
    file: ${PMC_SECRETS:-./secrets}/tls/ca.crt
  azurite-cert:
    file: ${PMC_SECRETS:-./secrets}/tls/azurite.crt
  azurite-key:
    file: ${PMC_SECRETS:-./secrets}/tls/azurite.key
  ad-admin-password:
    file: ${PMC_SECRETS:-./secrets}/ad-admin-password
  ad-tls-cert:
    file: ${PMC_SECRETS:-./secrets}/tls/ad-dc.crt
  ad-tls-key:
    file: ${PMC_SECRETS:-./secrets}/tls/ad-dc.key
