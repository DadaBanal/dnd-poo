# Prometheus (Path A, M3.3): scrapes the feed watch and itself, evaluates
# rules.yml, and hands what fires to Alertmanager. It keeps 90 days.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: watch
    static_configs:
      - targets: [watch:9100]
  - job_name: orders
    static_configs:
      - targets: [orders:8080]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
