name: imaging-platform

# The Path A platform (platform/imaging), started from empty volumes, tested
# as a modality, a viewer and a person with a browser would use it, restarted
# from its volumes alone, and tested again. Then backed up (to a stand-in
# R740xd, and from it to a stand-in Azure), deleted, rebuilt from the off-site
# copy alone, and tested once more. Synthetic DICOM only. Nothing here reaches
# PMC.
#
# Same trigger pattern as imaging-portal: push covers main, pull_request covers
# everything else, so each commit is tested once.
on:
  push:
    branches: [main]
    paths: ['platform/imaging/**', '.github/workflows/imaging-platform.yml']
  pull_request:
    paths: ['platform/imaging/**', '.github/workflows/imaging-platform.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Secrets are generated inside the run and destroyed with its volumes.
      - name: The platform, tested fresh, after a restart, and after a disaster
        run: platform/imaging/ci/run.sh
