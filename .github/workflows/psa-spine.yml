name: psa-spine

# A branch with an open pull request would otherwise run this twice, once for the
# push and once for the pull_request. Here that is only wasted runner time; in
# the imaging-portal workflow the same duplication actually failed a build. So
# push covers main, pull_request covers everything else, and each commit is
# tested once.
on:
  push:
    branches: [main]
    paths: ['platform/psa-spine/**', '.github/workflows/psa-spine.yml']
  pull_request:
    paths: ['platform/psa-spine/**', '.github/workflows/psa-spine.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/psa-spine
    # The oldest supported Python the code must still run on, and the newest.
    # 3.11 is security-only until 2027-10; 3.14 is supported to 2030-10.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      # v7: the v4/v5 actions run on Node 20, which GitHub removed from its
      # runners on 2026-09-23.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Standard library only, by design — no install step.
      - name: Tests
        run: python3 tests/test_spine.py

      # There is one schema, in schema/*.sql, and the SQL Server copy is
      # generated from it. Two copies of a commercial rule drift, and the copy
      # that drifts is the one nobody reads — which here would be the one on the
      # live server. This is where that gets caught.
      - name: sqlserver/ is in step with schema/
        run: python3 tools/sqlite_to_tsql.py --check

      # The whole path, as a person types it: import, reports, walkthrough,
      # email intake twice (the second must be a no-op), escrow backup, the desk
      # booting and challenging, and the refusal of a public bind. One Python
      # file, so the Windows pilot host runs exactly what CI runs.
      - name: End-to-end smoke run
        run: python3 tests/smoke.py

      # The fence: no real register, no addresses, no commercial amounts in git.
      - name: Repository fence
        run: |
          if grep -rInE '\b(10|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}\b' \
               --exclude-dir=.git . ; then
            echo "FAIL: a private network address is committed under platform/psa-spine"; exit 1
          fi
          echo "ok: no private network addresses"

  # D7 (25 Sep 2026): the desk runs on SQL Server. The same tests, against a
  # real SQL Server 2022 Express in a service container: every statement the
  # desk issues goes through the dialect translator and comes back with the
  # same answer, or this job is red. The SA password is made up per run and
  # lives only in the runner's memory; it is not a secret of anybody's.
  sql-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/psa-spine
    env:
      MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-Pw1
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-Pw1
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: ODBC driver and pyodbc
        run: |
          # --batch: the ubuntu-24.04 image of 20 Sep 2026 gives gpg no tty, and
          # without it gpg stops with "cannot open '/dev/tty'" (run 62, 29 Sep).
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          python -m pip install -q pyodbc
      # A database of its own and a user whose default schema is psa, as the
      # handoff has SQL01 do it; the tests apply the generated port themselves.
      - name: The test database
        run: |
          python - <<'PY'
          import os, pyodbc
          pw = os.environ["MSSQL_SA_PASSWORD"]
          c = pyodbc.connect("Driver={ODBC Driver 18 for SQL Server};Server=127.0.0.1,1433;UID=sa;PWD=" + pw + ";TrustServerCertificate=yes", autocommit=True)
          c.execute("CREATE DATABASE PMC_PSA")
          c.execute("ALTER DATABASE PMC_PSA SET READ_COMMITTED_SNAPSHOT ON")
          c.execute("CREATE LOGIN psa_desk WITH PASSWORD = '" + pw + "', CHECK_POLICY = OFF")
          d = pyodbc.connect("Driver={ODBC Driver 18 for SQL Server};Server=127.0.0.1,1433;Database=PMC_PSA;UID=sa;PWD=" + pw + ";TrustServerCertificate=yes", autocommit=True)
          d.execute("CREATE USER psa_desk FOR LOGIN psa_desk WITH DEFAULT_SCHEMA = psa")
          d.execute("ALTER ROLE db_owner ADD MEMBER psa_desk")
          print("ready")
          PY
      - name: Tests, on SQL Server
        env:
          PSA_TEST_DB: Driver={ODBC Driver 18 for SQL Server};Server=127.0.0.1,1433;Database=PMC_PSA;UID=psa_desk;PWD=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=yes
        run: python tests/test_spine.py

  # The pilot host is Windows (DND-SQL01). Nine intake tests once passed here on
  # Linux and failed there, because text written on Windows gains a "\r" per
  # line. The unit tests run on Windows too, so that class of bug fails in CI
  # rather than on the host.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platform/psa-spine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tests
        run: python tests/test_spine.py
      - name: End-to-end smoke run
        run: python tests/smoke.py
      - name: sqlserver/ is in step with schema/
        run: python tools/sqlite_to_tsql.py --check
